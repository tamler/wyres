[workspace]
resolver = "2"
members = ["crates/wyres-core", "crates/wyres"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tamler/wyres"
rust-version = "1.88"

[workspace.dependencies]
wyres-core = { path = "crates/wyres-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
globset = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "io-std", "net", "sync"] }
tokio-util = "0.7"
rmcp = { version = "3.8", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
